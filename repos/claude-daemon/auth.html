<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Login - Claude Daemon</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 50px 40px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
            max-width: 450px;
            width: 100%;
        }

        h1 {
            text-align: center;
            margin-bottom: 15px;
            font-size: 2em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .subtitle {
            text-align: center;
            margin-bottom: 35px;
            opacity: 0.9;
            font-size: 0.95em;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            opacity: 0.95;
        }

        input[type="password"] {
            width: 100%;
            padding: 15px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 1em;
            transition: all 0.3s ease;
        }

        input[type="password"]:focus {
            outline: none;
            border-color: rgba(255, 255, 255, 0.6);
            background: rgba(255, 255, 255, 0.15);
        }

        input[type="password"]::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .error {
            background: rgba(220, 38, 38, 0.2);
            border: 1px solid rgba(220, 38, 38, 0.5);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 20px;
            display: none;
            text-align: center;
        }

        .error.show {
            display: block;
            animation: shake 0.5s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            opacity: 0.7;
            font-size: 0.85em;
        }

        .lock-icon {
            text-align: center;
            font-size: 3em;
            margin-bottom: 20px;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="lock-icon">🔒</div>
        <h1>Claude Daemon Dashboard</h1>
        <p class="subtitle">Enter your access token to continue</p>

        <div id="error-message" class="error">
            Invalid access token. Please try again.
        </div>

        <form id="login-form">
            <div class="form-group">
                <label for="access-token">Access Token</label>
                <input
                    type="password"
                    id="access-token"
                    name="access-token"
                    placeholder="Enter your access token"
                    required
                    autocomplete="off"
                    autofocus
                >
            </div>
            <button type="submit">Access Dashboard</button>
        </form>

        <div class="footer">
            🤖 Multi-Persona AI Daemon System
        </div>
    </div>

    <script>
        // Security: Store the hashed token (SHA-256 of the actual token)
        // Actual token is stored securely and provided to authorized users
        const VALID_TOKEN_HASH = '79a8427e7b4d26669df2b08c90aae85667ee979fe74efb1f1a975570747f3371';

        // Multiple valid tokens can be added here for different users
        const VALID_TOKENS = new Set([
            '79a8427e7b4d26669df2b08c90aae85667ee979fe74efb1f1a975570747f3371', // Dashboard access token (hashed)
        ]);

        async function hashToken(token) {
            const encoder = new TextEncoder();
            const data = encoder.encode(token);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        async function checkAuth() {
            const storedHash = localStorage.getItem('daemon_auth_token');
            if (storedHash && VALID_TOKENS.has(storedHash)) {
                // Already authenticated
                window.location.href = 'dashboard.html';
            }
        }

        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();

            const tokenInput = document.getElementById('access-token');
            const token = tokenInput.value.trim();
            const errorDiv = document.getElementById('error-message');

            // Hash the entered token
            const enteredHash = await hashToken(token);

            // Check if it matches any valid token
            if (VALID_TOKENS.has(enteredHash)) {
                // Store the hash (not the actual token)
                localStorage.setItem('daemon_auth_token', enteredHash);
                localStorage.setItem('daemon_auth_time', Date.now());

                // Redirect to dashboard
                window.location.href = 'dashboard.html';
            } else {
                // Show error
                errorDiv.classList.add('show');
                tokenInput.value = '';
                tokenInput.focus();

                // Hide error after 3 seconds
                setTimeout(() => {
                    errorDiv.classList.remove('show');
                }, 3000);
            }
        });

        // Check auth on page load
        checkAuth();

        // Clear auth after 24 hours (optional)
        setInterval(() => {
            const authTime = localStorage.getItem('daemon_auth_time');
            if (authTime) {
                const elapsed = Date.now() - parseInt(authTime);
                const TWENTY_FOUR_HOURS = 24 * 60 * 60 * 1000;
                if (elapsed > TWENTY_FOUR_HOURS) {
                    localStorage.removeItem('daemon_auth_token');
                    localStorage.removeItem('daemon_auth_time');
                    window.location.reload();
                }
            }
        }, 60000); // Check every minute
    </script>
</body>
</html>
